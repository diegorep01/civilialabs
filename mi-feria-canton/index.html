<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<title>Feria Cantón — Comparador</title>
<meta name="robots" content="noindex,nofollow"/>
<link rel="manifest" href="manifest.json"/>
<link rel="apple-touch-icon" href="icon-180.png"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="theme-color" content="#1E3A5F"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#F8FAFC;color:#0F172A;padding-bottom:70px}
:root{--navy:#1E3A5F;--teal:#14B8A6;--teal2:#0D9488;--border:#E2E8F0;--muted:#64748B;--gold:#D97706}
header{background:var(--navy);color:#fff;padding:16px 18px;position:sticky;top:0;z-index:50;box-shadow:0 2px 8px rgba(0,0,0,.15)}
header h1{font-size:17px;font-weight:800}
header p{font-size:11.5px;opacity:.75;margin-top:2px}
.tabs{display:flex;background:#fff;border-bottom:1px solid var(--border);position:sticky;top:60px;z-index:49}
.tab{flex:1;padding:12px;text-align:center;font-size:13px;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent}
.tab.act{color:var(--navy);border-color:var(--teal)}
main{padding:14px}
.view{display:none}
.view.act{display:block}

/* FORM */
.card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:12px}
.fg{margin-bottom:10px}
.fg label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:4px}
.fg input,.fg select,.fg textarea{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:15px;font-family:inherit;background:#fff}
.fg textarea{resize:vertical;min-height:50px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stars{display:flex;gap:6px;font-size:26px;cursor:pointer;user-select:none}
.star{color:#D1D9E0}
.star.on{color:var(--gold)}
.photo-prev{width:100%;max-height:180px;object-fit:cover;border-radius:8px;margin-top:8px;display:none}
.btn{display:block;width:100%;padding:13px;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
.btn-prim{background:var(--teal);color:#fff}
.btn-prim:active{background:var(--teal2)}
.btn-sec{background:#F1F5F9;color:var(--navy)}

/* LISTA */
.filtros{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto}
.filtros select{padding:8px 10px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;background:#fff;flex-shrink:0}
.prod{background:#fff;border:1px solid var(--border);border-radius:12px;margin-bottom:10px;overflow:hidden;display:flex;gap:0}
.prod img{width:88px;height:88px;object-fit:cover;flex-shrink:0;background:#EEF2F7}
.prod-body{padding:10px 12px;flex:1;min-width:0}
.prod-top{display:flex;justify-content:space-between;gap:8px}
.prod-nombre{font-weight:800;font-size:14.5px}
.prod-cat{font-size:10.5px;color:var(--teal2);font-weight:700;text-transform:uppercase}
.prod-precio{font-weight:800;color:var(--navy);font-size:15px;white-space:nowrap}
.prod-meta{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.5}
.prod-stars{color:var(--gold);font-size:13px;margin-top:3px}
.prod-actions{display:flex;gap:6px;margin-top:8px}
.chk{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--navy)}
.chk input{width:18px;height:18px}
.mini{padding:5px 10px;font-size:11.5px;font-weight:700;border-radius:6px;border:1.5px solid var(--border);background:#fff;color:var(--muted)}
.mini.del{color:#DC2626;border-color:#FECACA}
.empty{text-align:center;padding:50px 20px;color:var(--muted)}

/* COMPARADOR */
.comp-wrap{overflow-x:auto}
table.cmp{width:100%;border-collapse:collapse;font-size:12.5px;min-width:340px}
table.cmp th,table.cmp td{padding:8px 10px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}
table.cmp th{background:#F8FAFC;font-size:11px;color:var(--muted);text-transform:uppercase}
table.cmp img{width:60px;height:60px;object-fit:cover;border-radius:6px}

/* EXPORT */
.export-bar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);padding:10px 14px;display:flex;gap:8px;z-index:60}
.export-bar button{flex:1;padding:11px;border-radius:9px;font-size:13px;font-weight:700;border:1.5px solid var(--border);background:#fff;color:var(--navy)}
</style>
</head>
<body>

<header>
  <h1>🇨🇳 Feria Cantón — Comparador</h1>
  <p>Anota, compara y decide sobre la marcha. Todo se guarda en tu teléfono.</p>
</header>

<div class="tabs">
  <div class="tab act" data-v="add" onclick="setTab('add')">+ Agregar</div>
  <div class="tab" data-v="list" onclick="setTab('list')">Lista</div>
  <div class="tab" data-v="cmp" onclick="setTab('cmp')">Comparar</div>
</div>

<main>

  <!-- AGREGAR -->
  <div class="view act" id="v-add">
    <div class="card">
      <div class="fg">
        <label>Nombre del producto *</label>
        <input id="f-nombre" type="text" placeholder="Ej: Bomba de agua 1HP"/>
      </div>
      <div class="row2">
        <div class="fg">
          <label>Categoría</label>
          <select id="f-cat">
            <option>Electrónica</option>
            <option>Hogar</option>
            <option>Ferretería / Herramientas</option>
            <option>Iluminación</option>
            <option>Juguetes</option>
            <option>Textil</option>
            <option>Maquinaria</option>
            <option>Otro</option>
          </select>
        </div>
        <div class="fg">
          <label>Rating</label>
          <div class="stars" id="f-stars">
            <span class="star" data-n="1">★</span><span class="star" data-n="2">★</span>
            <span class="star" data-n="3">★</span><span class="star" data-n="4">★</span>
            <span class="star" data-n="5">★</span>
          </div>
        </div>
      </div>
      <div class="row2">
        <div class="fg">
          <label>Precio unitario</label>
          <input id="f-precio" type="number" step="0.01" placeholder="Ej: 3.50"/>
        </div>
        <div class="fg">
          <label>Moneda</label>
          <select id="f-moneda">
            <option>USD</option>
            <option>CNY</option>
            <option>PEN</option>
          </select>
        </div>
      </div>
      <div class="row2">
        <div class="fg">
          <label>MOQ (cantidad mínima)</label>
          <input id="f-moq" type="text" placeholder="Ej: 500 unidades"/>
        </div>
        <div class="fg">
          <label>Stand / Pasillo</label>
          <input id="f-stand" type="text" placeholder="Ej: Hall 3, C-15"/>
        </div>
      </div>
      <div class="fg">
        <label>Proveedor / contacto (WeChat, tel, tarjeta)</label>
        <input id="f-proveedor" type="text" placeholder="Ej: WeChat: abc123 · Sr. Li"/>
      </div>
      <div class="fg">
        <label>Foto</label>
        <input id="f-foto" type="file" accept="image/*" capture="environment"/>
        <img id="f-foto-prev" class="photo-prev"/>
      </div>
      <div class="fg">
        <label>Notas</label>
        <textarea id="f-nota" placeholder="Calidad percibida, negociación, comparado con otro stand..."></textarea>
      </div>
      <button class="btn btn-prim" onclick="guardarProducto()">Guardar producto</button>
    </div>
  </div>

  <!-- LISTA -->
  <div class="view" id="v-list">
    <div class="filtros">
      <select id="ord-cat" onchange="renderLista()">
        <option value="">Todas las categorías</option>
      </select>
      <select id="ord-by" onchange="renderLista()">
        <option value="fecha">Más recientes</option>
        <option value="precio">Precio: menor a mayor</option>
        <option value="rating">Rating: mayor a menor</option>
      </select>
    </div>
    <div id="lista"></div>
  </div>

  <!-- COMPARAR -->
  <div class="view" id="v-cmp">
    <div id="cmp-empty" class="empty">Marca "Comparar" en 2 o más productos desde la Lista.</div>
    <div class="comp-wrap"><table class="cmp" id="cmp-table" style="display:none"></table></div>
  </div>

</main>

<div class="export-bar">
  <button onclick="exportarCSV()">⬇️ Exportar CSV</button>
  <button onclick="compartirWhatsApp()">📲 Compartir resumen</button>
</div>

<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('service-worker.js').catch(()=>{});
}

const LS_KEY = 'feria_canton_productos';
function loadProductos(){ try{ return JSON.parse(localStorage.getItem(LS_KEY))||[]; }catch(e){ return []; } }
function saveProductos(p){ localStorage.setItem(LS_KEY, JSON.stringify(p)); }
let productos = loadProductos();
let curRating = 0;
let fotoDataUrl = '';

function setTab(v){
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('act', t.dataset.v===v));
  document.querySelectorAll('.view').forEach(el=>el.classList.remove('act'));
  document.getElementById('v-'+v).classList.add('act');
  if(v==='list') renderLista();
  if(v==='cmp') renderComparador();
}

document.querySelectorAll('#f-stars .star').forEach(s=>{
  s.addEventListener('click', ()=>{
    curRating = parseInt(s.dataset.n);
    document.querySelectorAll('#f-stars .star').forEach(x=>x.classList.toggle('on', parseInt(x.dataset.n)<=curRating));
  });
});

document.getElementById('f-foto').addEventListener('change', (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev)=>{
    fotoDataUrl = ev.target.result;
    const prev = document.getElementById('f-foto-prev');
    prev.src = fotoDataUrl;
    prev.style.display = 'block';
  };
  reader.readAsDataURL(file);
});

function guardarProducto(){
  const nombre = document.getElementById('f-nombre').value.trim();
  if(!nombre){ alert('Ponle un nombre al producto.'); return; }
  const p = {
    id: Date.now(),
    nombre,
    categoria: document.getElementById('f-cat').value,
    precio: parseFloat(document.getElementById('f-precio').value) || 0,
    moneda: document.getElementById('f-moneda').value,
    moq: document.getElementById('f-moq').value.trim(),
    stand: document.getElementById('f-stand').value.trim(),
    proveedor: document.getElementById('f-proveedor').value.trim(),
    foto: fotoDataUrl,
    nota: document.getElementById('f-nota').value.trim(),
    rating: curRating,
    fecha: new Date().toISOString(),
    comparar: false,
  };
  productos.unshift(p);
  saveProductos(productos);

  // reset form
  document.getElementById('f-nombre').value = '';
  document.getElementById('f-precio').value = '';
  document.getElementById('f-moq').value = '';
  document.getElementById('f-stand').value = '';
  document.getElementById('f-proveedor').value = '';
  document.getElementById('f-nota').value = '';
  document.getElementById('f-foto').value = '';
  document.getElementById('f-foto-prev').style.display = 'none';
  fotoDataUrl = '';
  curRating = 0;
  document.querySelectorAll('#f-stars .star').forEach(x=>x.classList.remove('on'));

  setTab('list');
}

function eliminarProducto(id){
  if(!confirm('¿Eliminar este producto?')) return;
  productos = productos.filter(p=>p.id!==id);
  saveProductos(productos);
  renderLista();
}

function toggleComparar(id, checked){
  const p = productos.find(x=>x.id===id);
  if(p){ p.comparar = checked; saveProductos(productos); }
}

function fmtPrecio(p){
  const simb = {USD:'$', CNY:'¥', PEN:'S/'}[p.moneda] || '';
  return p.precio ? simb+' '+p.precio.toFixed(2) : '—';
}

function renderLista(){
  const cats = [...new Set(productos.map(p=>p.categoria))];
  const selCat = document.getElementById('ord-cat');
  const curCat = selCat.value;
  selCat.innerHTML = '<option value="">Todas las categorías</option>' +
    cats.map(c=>`<option value="${c}" ${c===curCat?'selected':''}>${c}</option>`).join('');

  let vis = [...productos];
  const filtroCat = selCat.value;
  if(filtroCat) vis = vis.filter(p=>p.categoria===filtroCat);

  const ordBy = document.getElementById('ord-by').value;
  if(ordBy==='precio') vis.sort((a,b)=>a.precio-b.precio);
  else if(ordBy==='rating') vis.sort((a,b)=>b.rating-a.rating);
  else vis.sort((a,b)=>new Date(b.fecha)-new Date(a.fecha));

  const cont = document.getElementById('lista');
  if(!vis.length){ cont.innerHTML = '<div class="empty">Todavía no agregaste ningún producto.</div>'; return; }

  cont.innerHTML = vis.map(p=>`
    <div class="prod">
      <img src="${p.foto || ''}" onerror="this.style.display='none'"/>
      <div class="prod-body">
        <div class="prod-top">
          <div>
            <div class="prod-cat">${p.categoria}</div>
            <div class="prod-nombre">${p.nombre}</div>
          </div>
          <div class="prod-precio">${fmtPrecio(p)}</div>
        </div>
        <div class="prod-meta">
          ${p.moq ? 'MOQ: '+p.moq+' · ' : ''}${p.stand ? p.stand : ''}
          ${p.proveedor ? '<br>'+p.proveedor : ''}
          ${p.nota ? '<br>"'+p.nota+'"' : ''}
        </div>
        <div class="prod-stars">${'★'.repeat(p.rating)}${'☆'.repeat(5-p.rating)}</div>
        <div class="prod-actions">
          <label class="chk"><input type="checkbox" ${p.comparar?'checked':''} onchange="toggleComparar(${p.id}, this.checked)"/> Comparar</label>
          <button class="mini del" onclick="eliminarProducto(${p.id})">Eliminar</button>
        </div>
      </div>
    </div>
  `).join('');
}

function renderComparador(){
  const sel = productos.filter(p=>p.comparar);
  const table = document.getElementById('cmp-table');
  const empty = document.getElementById('cmp-empty');
  if(sel.length < 2){
    table.style.display = 'none';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';
  table.style.display = 'table';

  const filas = [
    ['Foto', p=>p.foto?`<img src="${p.foto}">`:'—'],
    ['Producto', p=>p.nombre],
    ['Categoría', p=>p.categoria],
    ['Precio', p=>fmtPrecio(p)],
    ['MOQ', p=>p.moq||'—'],
    ['Stand', p=>p.stand||'—'],
    ['Proveedor', p=>p.proveedor||'—'],
    ['Rating', p=>'★'.repeat(p.rating)+'☆'.repeat(5-p.rating)],
    ['Nota', p=>p.nota||'—'],
  ];

  table.innerHTML =
    '<tr><th></th>' + sel.map(p=>`<th>${p.nombre}</th>`).join('') + '</tr>' +
    filas.map(([label, fn]) =>
      `<tr><th>${label}</th>` + sel.map(p=>`<td>${fn(p)}</td>`).join('') + '</tr>'
    ).join('');
}

function exportarCSV(){
  if(!productos.length){ alert('No hay productos guardados todavía.'); return; }
  const cols = ['nombre','categoria','precio','moneda','moq','stand','proveedor','rating','nota','fecha'];
  const rows = [cols.join(',')];
  productos.forEach(p=>{
    rows.push(cols.map(c=>`"${String(p[c]??'').replace(/"/g,'""')}"`).join(','));
  });
  const blob = new Blob([rows.join('\n')], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'feria_canton_' + new Date().toISOString().slice(0,10) + '.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function compartirWhatsApp(){
  if(!productos.length){ alert('No hay productos guardados todavía.'); return; }
  let texto = 'Feria Cantón — mis productos:\n\n';
  productos.slice(0,15).forEach(p=>{
    texto += `• ${p.nombre} (${p.categoria}) — ${fmtPrecio(p)} — MOQ ${p.moq||'?'} — ${'★'.repeat(p.rating)}\n`;
  });
  if(productos.length>15) texto += `\n...y ${productos.length-15} más (ver CSV completo).`;
  const url = 'https://wa.me/?text=' + encodeURIComponent(texto);
  window.open(url, '_blank');
}

renderLista();
</script>
</body>
</html>
